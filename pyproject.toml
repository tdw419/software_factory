[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
version = "0.1.0"
description = "Standalone autonomous builder lane: change-gated ticks, tickets, receipts, GO-gated disruptions, mechanical observers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jericho" }]
dependencies = []

[project.scripts]
factory = "software_factory.cli:main"

[tool.setuptools]
packages = ["software_factory"]
